<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LibraTech - Contact</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        <img src="../images/logo.png" alt="LibraTech Logo">
        <span>LibraTech</span>
    </div>

    <nav>
        <a href="../index.html">Home</a>
        <a href="books.html">Books</a>
        <a href="categories.html">Categories</a>
        <a href="digital-resources.html">Digital Resources</a>
        <a href="services.html">Services</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="contact.html">Contact</a>
    </nav>

</header>

<section class="page-title">
    <h1>Contact Us</h1>
    <p>Get in touch with LibraTech</p>
</section>

<section class="contact-section">

    <form class="contact-form">

        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email">

        <label for="subject">Subject</label>
        <input type="text" id="subject" placeholder="Enter subject">

        <label for="message">Message</label>
        <textarea id="message" rows="6"
                  placeholder="Enter your message"></textarea>

        <button type="submit">Send Message</button>

    </form>

</section>

<footer>
    <p>© 2026 LibraTech | Library & Digital Resource Management System</p>
</footer>

</body>
</html>
